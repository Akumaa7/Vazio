<style>
:root{--bg:#05060A;--ink:#EDE9E2;--dim:#85837f;--faint:rgba(237,233,226,.16);--hot:#e6c88a;--serif:'Instrument Serif',Georgia,serif;--ui:'Instrument Sans',system-ui,sans-serif;--inv:1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font:14px var(--ui)}

.lk{stroke:var(--faint);stroke-width:calc(1.2px*var(--inv));transition:stroke .3s}.lk.on{stroke:var(--hot)}

.note.h{font-style:normal;font-weight:500}.note.h .t{border-bottom:1px solid var(--faint);padding-bottom:2px}
.chev{display:none;position:absolute;left:12px;top:100%;margin-top:2px;padding:4px 8px 4px 0;color:var(--dim);font:500 11px var(--ui);cursor:pointer}.note.h .chev{display:block}.note.h.co .chev{color:var(--hot)}

.note.sel .bar{display:flex}.bar button{padding:6px 9px}
.note.lift .t{transform:scale(1.04);transform-origin:0 50%;text-shadow:0 0 20px rgba(237,233,226,.3)}.snap{transition:opacity .4s,left .35s,top .35s}
.fx::after{content:'';position:absolute;right:3px;top:7px;width:3px;height:3px;border-radius:50%;background:var(--dim)}
.xx{pointer-events:all;cursor:pointer}.xx circle{fill:transparent}.xx .xv{fill:#0a0c12;stroke:var(--hot);stroke-width:1}.xx path{stroke:var(--hot);stroke-width:1.3}
.dim{opacity:.1}.found .t{animation:pulse 1.6s 2;color:var(--hot)}.tgt .t{color:var(--hot)}.del{opacity:.3}
.far .t,.far .port,.far .chev{opacity:0}.far .bar{display:none!important}
.far .note::after{content:'';position:absolute;left:6px;top:50%;width:calc(8px*var(--inv));height:calc(8px*var(--inv));margin-top:calc(-4px*var(--inv));border-radius:50%;background:var(--ink);box-shadow:0 0 calc(16px*var(--inv)) var(--hot)}
button{all:unset;cursor:pointer;padding:7px 12px;border-radius:99px;color:var(--dim);font:500 13px var(--ui);transition:.25s}
button:hover{color:var(--ink)}button.on{background:var(--ink);color:var(--bg)}
#dot{display:block;position:fixed;z-index:6;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:64px;height:40px;margin-left:-32px;padding:0;border-radius:0}
#dot::after{content:'';position:absolute;left:30px;top:18px;width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.28}

.g{display:flex;flex-wrap:wrap;justify-content:center}#dock:not(.dr) .g2,#dock.dr .g1{display:none}

#bin.on{opacity:.5}#bin.on.hot{opacity:1;color:var(--ink)}

#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

#sheet.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}

#sa{display:block;margin:2px 0;padding:6px 4px}#sm{display:block;margin:8px 0;color:var(--dim);font-size:12px}.r{display:flex;gap:2px}
#gate{position:fixed;z-index:20;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s,visibility .5s}
#gate.hide{opacity:0;visibility:hidden;pointer-events:none}#gate.ld>:not(#gm){opacity:0;pointer-events:none}

#gate input{width:min(280px,80vw);padding:9px 0;background:none;border:0;border-bottom:1px solid var(--faint);border-radius:0;color:var(--ink);font:16px var(--ui);outline:none}#gate input:focus{border-color:var(--hot)}
#gm{min-height:1.3em;max-width:80vw;color:var(--dim);font-size:12px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="stage"><div id="grid"></div><div id="vig"></div><div id="world"><svg id="ink"><g id="lks"></g><g id="drw"></g></svg></div></div>
<input id="q" placeholder="buscar" autocomplete="off">
<div id="bin">soltar para apagar</div>
<button id="dot" aria-label="menu"></button>
<nav class="pill" id="dock"><div class="g g1"><button id="bS"></button><button id="bH">+ subespaço</button><button id="bN">+ anotação</button><button id="bD">rabiscar</button><button id="bQ">buscar</button><button id="bF">tudo</button></div><div class="g g2"><button id="bT">traço</button><button id="bE">borracha</button><button id="bU">desfazer</button><button id="bK">ok</button></div></nav>

<button id="toast">apagado · desfazer</button>
<div id="sheet"><small class="lb">espaços</small><div id="sl"></div><button id="sa">+ novo espaço</button><div id="sh"></div><small id="sm"></small><div class="r"><button id="cex">exportar</button><button id="cim">importar</button><button id="co">sair</button></div><input id="cf" type="file" accept=".json,application/json" style="display:none"></div>
<div id="gate" class="ld"><h1>vazio</h1><input id="ge" type="email" placeholder="e-mail" autocomplete="email"><input id="gp" type="password" placeholder="senha" autocomplete="current-password"><div class="r"><button id="gi">entrar</button><button id="gr">criar conta</button></div><small id="gm"></small><button id="gz">continuar offline</button></div>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',KEY='vazio:v1',LS=localStorage;
const st=$('#stage'),world=$('#world'),LK=$('#lks'),DR=$('#drw'),Q=$('#q'),dock=$('#dock'),sheet=$('#sheet'),gate=$('#gate'),bin=$('#bin'),toastB=$('#toast'),root=document.documentElement;
let pend=null,S={},cur='main',cams={},cam={x:0,y:0,k:1},sel=null,selL=null,selS=0,sug=null,tool='',raf,tmr,drag=null,last=0,lp=[0,0],hits=[],hi=0,ud=0,tt,sb=null,user=null,lastC='',rt,synced=false,ST='';
const HID=new Set(),els=new Map(),P=new Map(),ign=new Set(),uid=()=>Math.random().toString(36).slice(2,9),nm=id=>S.notes.find(n=>n.id==id),inS=x=>x.sp==cur;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const STOP=new Set('para como mais mas foi das dos nos nas seu sua isso esta este esse essa tem ter sao ser muito sobre meu minha anda quando onde voce pode aqui criam cada uma que nao'.split(' '));
const tk=s=>new Set((norm(s).match(/[a-z]{4,}/g)||[]).filter(w=>!STOP.has(w)).map(w=>w.slice(0,5)));
const w2=e=>[(e.clientX-cam.x)/cam.k,(e.clientY-cam.y)/cam.k];
const lk=l=>[l.a,l.b].sort().join('|'),tomb=k=>S.del[k]=Date.now();
const nb=id=>S.links.map(l=>l.a==id?nm(l.b):l.b==id?nm(l.a):0).filter(Boolean),sz=(n,s)=>{s.fontSize=(n.k=='h'?28:24)*(n.s||1)+'px';s.maxWidth=340*(n.s||1)+'px'};
const persist=()=>{try{cams[cur]=cam;LS.setItem(KEY,JSON.stringify({...S,cur,cams,ign:[...ign]}))}catch(e){}};
const save=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{persist();push()},300)};
const sg=x=>JSON.stringify([x.notes.map(n=>n.id+n.u).sort(),x.links.map(l=>lk(l)+l.u).sort(),x.strokes.map(s=>s.id+s.u).sort(),x.sps.map(p=>p.id+p.u).sort(),Object.keys(x.del||{}).sort()]);
function fix(d){d.notes=d.notes||[];d.links=d.links||[];d.strokes=d.strokes||[];d.del=d.del||{};d.sps=d.sps&&d.sps.length?d.sps:[{id:'main',name:'Principal',u:0,c:0}];d.notes.forEach(n=>{n.u=n.u||n.c||1;n.sp=n.sp||'main'});d.links.forEach(l=>l.u=l.u||0);d.strokes.forEach(x=>{x.id=x.id||uid();x.u=x.u||0;x.sp=x.sp||'main'});return d}
const clean=d=>{d.notes=d.notes.filter(n=>!(n.sd&&n.u==n.c));d.strokes=d.strokes.filter(x=>!x.sd);const ids=new Set(d.notes.map(n=>n.id));d.links=d.links.filter(l=>ids.has(l.a)&&ids.has(l.b));return d};
function applyCam(){world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;world.style.setProperty('--inv',1/cam.k);world.classList.toggle('far',cam.k<.42);let s=48*cam.k;while(s<20)s*=4;const g=$('#grid').style;g.setProperty('--gs',s+'px');g.setProperty('--gx',cam.x+'px');g.setProperty('--gy',cam.y+'px');save()}
function zoomAt(px,py,k){k=Math.min(3,Math.max(.08,k));cam.x=px-(px-cam.x)*k/cam.k;cam.y=py-(py-cam.y)*k/cam.k;cam.k=k;applyCam()}
function fly(cx,cy,k,ms=800){const W=innerWidth,H=innerHeight,c=[(W/2-cam.x)/cam.k,(H/2-cam.y)/cam.k],k0=cam.k,t0=performance.now();cancelAnimationFrame(raf);const f=t=>{let u=ms?Math.min(1,(t-t0)/ms):1;u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;const kk=k0*Math.pow(k/k0,u);cam.k=kk;cam.x=W/2-(c[0]+(cx-c[0])*u)*kk;cam.y=H/2-(c[1]+(cy-c[1])*u)*kk;applyCam();if(u<1)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function fit(ms){const L=S.notes.filter(n=>inS(n)&&!HID.has(n.id));if(!L.length)return fly(0,0,1,ms);let a=1e9,b=1e9,c=-1e9,d=-1e9;L.forEach(n=>{const e=els.get(n.id);a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+e.offsetWidth);d=Math.max(d,n.y+e.offsetHeight)});fly((a+c)/2,(b+d)/2,Math.max(.1,Math.min(1.1,(innerWidth-90)/(c-a),(innerHeight-220)/(d-b))),ms)}
function mk(n,f){const e=document.createElement('div');e.className='note'+(n.k=='h'?' h':'')+(n.f?' fx':'')+(f?' nw':'');e.dataset.id=n.id;e.style.cssText=`left:${n.x}px;top:${n.y}px`;sz(n,e.style);e.innerHTML='<div class="t"></div><i class="port"></i><b class="chev"></b><div class="bar"><button data-a="-">A−</button><button data-a="+">A+</button>'+(n.k=='h'?'<button data-a="cn">+ nota</button><button data-a="co">recolher</button>':'')+'<button data-a="fx">'+(n.f?'liberar':'fixar')+'</button><button data-a="x">apagar</button></div>';const t=e.firstChild;t.spellcheck=false;t.textContent=n.t;els.set(n.id,e);world.appendChild(e)}
const box=id=>{const n=nm(id),e=els.get(id);return{x:n.x,y:n.y,w:e.offsetWidth,h:e.offsetHeight}};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function geo(a,b){const A=box(a),B=box(b),dx=B.x+B.w/2-A.x-A.w/2,dy=B.y+B.h/2-A.y-A.h/2;let p,q,c,d,m;if(Math.abs(dx)>Math.abs(dy)){const s=dx<0?-1:1;p=[A.x+(s>0?A.w:0),A.y+A.h/2];q=[B.x+(s>0?0:B.w),B.y+B.h/2];m=Math.abs(q[0]-p[0])/2;c=[p[0]+s*m,p[1]];d=[q[0]-s*m,q[1]]}else{const s=dy<0?-1:1;p=[A.x+A.w/2,A.y+(s>0?A.h:0)];q=[B.x+B.w/2,B.y+(s>0?0:B.h)];m=Math.abs(q[1]-p[1])/2;c=[p[0],p[1]+s*m];d=[q[0],q[1]-s*m]}return{d:`M${p}C${c} ${d} ${q}`,m:[(p[0]+3*c[0]+3*d[0]+q[0])/8,(p[1]+3*c[1]+3*d[1]+q[1])/8].map(v=>+v.toFixed(1))}}
const path=(a,b)=>geo(a,b).d;
function rl(){let xs='',h=S.links.map((l,i)=>{if(!els.has(l.a)||!els.has(l.b)||HID.has(l.a)||HID.has(l.b))return'';const g=geo(l.a,l.b),d=g.d,on=l.a==sel||l.b==sel||selL===i;if(on)xs+=`<g class="xx" data-i="${i}" style="transform:translate(${g.m[0]}px,${g.m[1]}px) scale(var(--inv))"><circle r="22"/><circle class="xv" r="9"/><path d="M-3-3l6 6m0-6l-6 6"/></g>`;return`<path class="lk${on?' on':''}" d="${d}"/><path class="hit" data-i="${i}" d="${d}"/>`}).join('');if(sug){const d=path(sug.a,sug.b);h+=`<path class="sg${selS?' on':''}" d="${d}"/><path class="hit" data-sg="1" d="${d}"/>`}LK.innerHTML=h+xs}
const sm=p=>p.length<3?`M${p[0]}L${p[p.length-1]}`:`M${p[0]}`+p.slice(1,-1).map((q,i)=>`Q${q} ${[(q[0]+p[i+2][0])/2,(q[1]+p[i+2][1])/2]}`).join('')+`L${p[p.length-1]}`;
const rd=()=>DR.innerHTML=S.strokes.filter(inS).map(s=>`<path class="ds" d="${sm(s.p)}"/>`).join('');
function ctx(){const h=pend?'<button data-a="th">subespaço</button><button data-a="tn">anotação</button>':selL!=null?'<button data-a="dl">desligar</button>':selS?'<button data-a="ys">ligar</button><button data-a="ns">ignorar</button>':'';$('#ctx').innerHTML=h;$('#ctx').classList.toggle('on',!!h)}
function select(id){sel=id;selL=null;selS=0;pend=null;els.forEach((e,k)=>e.classList.toggle('sel',k==id));if(id)fitBar(id);rl();ctx()}
function fitBar(id){const b=els.get(id)?.querySelector('.bar');if(!b)return;b.style.left='0';const o=b.getBoundingClientRect().right-(innerWidth-8);if(o>0)b.style.left=-o/cam.k+'px'}
function edit(id){const t=els.get(id).firstChild;t.contentEditable='plaintext-only';if(t.contentEditable!='plaintext-only')t.contentEditable='true';t.style.userSelect=t.style.webkitUserSelect='text';t.focus();const r=document.createRange();r.selectNodeContents(t);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function add(x,y,k,hub){pend=null;const n={id:uid(),sp:cur,k:k||'n',x:x-8,y:y-20,t:'',c:Date.now(),u:Date.now()};S.notes.push(n);if(hub)S.links.push({a:hub,b:n.id,u:Date.now()});mk(n,1);checkSug();select(n.id);if(hub){fly(n.x+80,n.y+20,Math.max(cam.k,.8),400);setTimeout(()=>edit(n.id),450)}else edit(n.id)}
function toggle(id){const n=nm(id);n.co=n.co?0:1;n.u=Date.now();checkSug();save()}
function vis(){els.forEach((e,id)=>{const n=nm(id);if(!n)return;const H=n.k=='h'?[]:nb(id).filter(x=>x.k=='h'),x=H.length&&H.every(y=>y.co);x?HID.add(id):HID.delete(id);e.style.display=x?'none':'';if(n.k=='h'){e.classList.toggle('co',!!n.co);e.querySelector('.chev').textContent=(n.co?'▸ ':'▾ ')+nb(id).filter(c=>c.k!='h').length;e.querySelector('[data-a=co]').textContent=n.co?'abrir':'recolher'}})}
function toast(t,f){ud=f;toastB.textContent=t+' · desfazer';toastB.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastB.classList.remove('on'),5000)}
