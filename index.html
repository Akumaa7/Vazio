<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>vazio</title>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#1e1e1e"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#1e1e1e;--card:#262626;--ink:#dadada;--dim:#8a8a8a;--faint:#3a3a3a;--hot:#a68af9;--ui:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;--inv:1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font:14px var(--ui)}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.2;background:radial-gradient(circle,#dadada 1px,transparent 1.4px) var(--gx,0) var(--gy,0)/var(--gs,48px) var(--gs,48px)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#ink{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#ink path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lk{stroke:#5a5a5a;stroke-width:calc(1.5px*var(--inv));transition:stroke .3s}
.lk.on{stroke:var(--hot)}
.pl{stroke:#7a68c4;opacity:.8;stroke-width:calc(1.5px*var(--inv));stroke-dasharray:calc(2px*var(--inv)) calc(5px*var(--inv))}
.hit{stroke:transparent;stroke-width:calc(16px*var(--inv));pointer-events:stroke;cursor:pointer}
.sg{stroke:var(--hot);opacity:.7;stroke-width:calc(1.2px*var(--inv));stroke-dasharray:calc(3px*var(--inv)) calc(7px*var(--inv));animation:march 1s linear infinite}
.ds{stroke:var(--ink);opacity:.72;stroke-width:calc(2px*var(--inv))}
@keyframes march{to{stroke-dashoffset:calc(-10px*var(--inv))}}
@keyframes rise{from{opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 22px var(--hot)}}
.note{position:absolute;width:max-content;min-width:120px;padding:10px 14px;background:var(--card);border:2px solid var(--faint);border-radius:8px;font:15px/1.5 var(--ui);cursor:grab;white-space:pre-wrap;word-break:break-word;animation:rise .3s;transition:border-color .2s,box-shadow .2s,opacity .3s}
.note.sel{border-color:var(--hot)}
.note.sub{padding-left:50px;background:#2c2840;border-color:#4a4270}
.note.sub.sel{border-color:var(--hot)}
.note.sub .t{font-weight:600}
.note.lift{pointer-events:none;border-color:var(--hot);box-shadow:0 10px 30px #000a;transform:scale(1.03)}
.note.tgt{border-color:var(--hot);box-shadow:0 0 0 3px #a68af966}
.note.hid{display:none}
.t{outline:none;caret-color:var(--hot);min-width:1ch;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.t:not([contenteditable=false]){user-select:text;-webkit-user-select:text}
.t:empty::before{content:'…';color:var(--dim)}
.tg{display:none;position:absolute;left:6px;top:10px;min-width:38px;padding:0 4px;text-align:center;font:500 12px/22px var(--ui);color:var(--hot);cursor:pointer}
.sub .tg{display:block}
.m{position:absolute;left:8px;top:calc(100% + 6px);font:400 12px var(--ui);color:var(--dim);opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
.note.sel .m,.note:hover .m{opacity:1}
.note.sel .m{pointer-events:auto}
.m u{margin-left:10px;padding:6px 4px;color:var(--hot);cursor:pointer}
.port{position:absolute;right:-9px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid var(--hot);border-radius:50%;background:var(--card);cursor:crosshair;opacity:0;transform:scale(.3);transition:.25s}
.note.sel .port,.note:hover .port{opacity:1;transform:none}
.dim{opacity:.1}.found{animation:pulse 1.6s 2}
.far .t,.far .m,.far .port,.far .tg{opacity:0}
.ui{position:fixed;z-index:5;pointer-events:none;color:var(--dim);font-size:12px}
#cam{left:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#sync{right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#mb{position:fixed;z-index:7;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:6px 12px;background:var(--card);border:1px solid var(--faint);border-radius:8px;font-size:16px;line-height:1.2}
#q{position:fixed;z-index:7;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-12px);width:min(420px,60vw);padding:8px 12px;background:var(--card);border:1px solid var(--faint);border-radius:8px;color:var(--ink);font:16px var(--ui);outline:none;opacity:0;pointer-events:none;transition:.3s}
#q.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#sug{position:fixed;z-index:6;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(520px,90vw);text-align:center;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:.4s}
#sug.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#sug p{margin:0 0 8px;font:15px/1.4 var(--ui)}#sug em{color:var(--hot);font-style:normal}
.dock{position:fixed;z-index:6;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);display:flex;gap:2px;max-width:96vw;overflow-x:auto;padding:5px;border:1px solid var(--faint);border-radius:10px;background:var(--card);opacity:0;transition:.35s}
.dock.show,.dock:hover{opacity:1;transform:translate(-50%,0)}
button{all:unset;cursor:pointer;padding:7px 12px;border-radius:7px;color:var(--dim);font:500 13px var(--ui);white-space:nowrap;transition:.2s}
button:hover{color:var(--ink)}button:focus-visible{outline:1px solid var(--hot)}button.on{background:var(--hot);color:#1e1e1e}
#sug button{padding:4px 12px;text-decoration:underline;text-underline-offset:4px}
kbd{font:inherit;margin-left:8px;padding:0 5px;border:1px solid var(--faint);border-radius:4px;opacity:.5}
@media(hover:none){.dock{opacity:1;transform:translate(-50%,0)}kbd{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
#side{position:fixed;z-index:9;left:0;top:0;bottom:0;width:min(290px,84vw);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-right:1px solid var(--faint);transform:translateX(-102%);transition:transform .3s}
#side.open{transform:none}
#side h4{display:flex;justify-content:space-between;align-items:center;margin:0;padding:0 10px 10px 16px;font:600 13px var(--ui);color:var(--dim)}
#sl{flex:1;overflow:auto;padding:0 6px}#sl p{padding:0 10px;color:var(--dim)}
.r{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.r:hover{background:#333}
.r.s{margin-top:4px;font-weight:600}
.r.k{padding-left:32px;color:#bbb}
.r b{width:20px;color:var(--hot);font-weight:400;text-align:center}
.r small{margin-left:auto;color:var(--dim)}
.h{padding:14px 10px 4px;font-size:12px;color:var(--dim)}
#sf{display:flex;padding:8px 10px 0;border-top:1px solid var(--faint)}
#cloud{position:fixed;z-index:8;left:50%;top:50%;width:min(340px,88vw);padding:22px;background:var(--card);border:1px solid var(--faint);border-radius:12px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.35s}
#cloud.open{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
#cloud p{margin:0 0 14px;font:600 17px var(--ui)}
#cloud input{display:block;width:100%;margin:0 0 10px;padding:8px 0;background:none;border:0;border-bottom:1px solid var(--faint);color:var(--ink);font:15px var(--ui);outline:none;transition:border-color .3s}
#cloud input:focus{border-color:var(--hot)}
#cloud button{padding:7px 10px}
#cm{display:block;min-height:1.3em;margin-top:10px;color:var(--dim);font-size:12px}
</style></head><body>
<div id="stage"><div id="grid"></div><div id="world"><svg id="ink"><g id="lks"></g><g id="drw"></g></svg></div></div>
<button id="mb" aria-label="Subespaços">☰</button>
<div class="ui" id="cam"></div>
<input id="q" placeholder="buscar uma anotação" autocomplete="off">
<div id="sug"><p></p><div><button id="sy">conectar</button><button id="sn">ignorar</button></div></div>
<div class="ui" id="sync"></div>
<aside id="side"><h4>Subespaços<button id="ns">+ novo</button></h4><div id="sl"></div><div id="sf"><button id="bC">nuvem</button></div></aside>
<div id="cloud"><p>Guardar na nuvem</p>
<input id="cu" placeholder="URL do projeto Supabase" autocomplete="off"><input id="ck" placeholder="chave anon (a pública)" autocomplete="off">
<input id="ce" type="email" placeholder="e-mail" autocomplete="email"><input id="cp" type="password" placeholder="senha" autocomplete="current-password">
<div><button id="ci">entrar</button><button id="cr">criar conta</button><button id="co">sair</button><button id="cx">fechar</button></div><div><button id="cex">exportar</button><button id="cim">importar</button><input id="cf" type="file" accept=".json,application/json" style="display:none"></div><small id="cm"></small></div>
<nav class="dock" id="dock"><button id="bN">nota<kbd>N</kbd></button><button id="bS">subespaço<kbd>S</kbd></button><button id="bD">rabiscar<kbd>D</kbd></button><button id="bQ">buscar<kbd>/</kbd></button><button id="bF">ver tudo<kbd>0</kbd></button></nav>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',KEY='vazio:v1';
const st=$('#stage'),world=$('#world'),LK=$('#lks'),DR=$('#drw'),Q=$('#q'),SG=$('#sug'),dock=$('#dock'),SD=$('#side');
let S,cam={x:0,y:0,k:1},sel=null,selL=null,sug=null,tool='',raf,tmr,drag=null,last=0,lp=[0,0],hits=[],hi=0;
const els=new Map(),P=new Map(),ign=new Set(),uid=()=>Math.random().toString(36).slice(2,9),nm=id=>S.notes.find(n=>n.id==id);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const STOP=new Set('para como mais mas foi das dos nos nas seu sua isso esta este esse essa tem ter sao ser muito sobre meu minha anda quando onde voce pode aqui criam cada uma que nao'.split(' '));
const tk=s=>new Set((norm(s).match(/[a-z]{4,}/g)||[]).filter(w=>!STOP.has(w)).map(w=>w.slice(0,5)));
const w2=e=>[(e.clientX-cam.x)/cam.k,(e.clientY-cam.y)/cam.k];
const save=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({...S,cam,ign:[...ign]}))}catch(e){}push()},300)};
const ce=(t,on)=>{if(!on){t.contentEditable='false';return}t.contentEditable='plaintext-only';if(t.contentEditable!='plaintext-only')t.contentEditable='true'};
const hid=id=>els.get(id)?.classList.contains('hid'),kids=id=>S.notes.filter(c=>c.p==id);
function applyCam(){world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;world.style.setProperty('--inv',1/cam.k);world.classList.toggle('far',cam.k<.42);let s=48*cam.k;while(s<20)s*=4;const g=$('#grid').style;g.setProperty('--gs',s+'px');g.setProperty('--gx',cam.x+'px');g.setProperty('--gy',cam.y+'px');$('#cam').textContent=`x ${Math.round((innerWidth/2-cam.x)/cam.k)} y ${Math.round((innerHeight/2-cam.y)/cam.k)} ${Math.round(cam.k*100)}%`;save()}
function zoomAt(px,py,k){k=Math.min(3,Math.max(.08,k));cam.x=px-(px-cam.x)*k/cam.k;cam.y=py-(py-cam.y)*k/cam.k;cam.k=k;applyCam()}
function fly(cx,cy,k,ms=800){const W=innerWidth,H=innerHeight,c=[(W/2-cam.x)/cam.k,(H/2-cam.y)/cam.k],k0=cam.k,t0=performance.now();cancelAnimationFrame(raf);const f=t=>{let u=ms?Math.min(1,(t-t0)/ms):1;u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;const kk=k0*Math.pow(k/k0,u);cam.k=kk;cam.x=W/2-(c[0]+(cx-c[0])*u)*kk;cam.y=H/2-(c[1]+(cy-c[1])*u)*kk;applyCam();if(u<1)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function fit(ms,L){L=(L||S.notes).filter(n=>!hid(n.id));if(!L.length)return fly(0,0,1,ms);let a=1e9,b=1e9,c=-1e9,d=-1e9;L.forEach(n=>{const e=els.get(n.id);a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+e.offsetWidth);d=Math.max(d,n.y+e.offsetHeight)});fly((a+c)/2,(b+d)/2,Math.max(.1,Math.min(1.1,(innerWidth-90)/(c-a),(innerHeight-220)/(d-b))),ms)}
function mk(n){const e=document.createElement('div'),s=n.s||1;e.className='note'+(n.k=='sub'?' sub':'');e.dataset.id=n.id;e.style.cssText=`left:${n.x}px;top:${n.y}px;font-size:${15*s}px;max-width:${340*s}px`;e.innerHTML='<div class="t"></div><span class="m"></span><i class="port"></i><b class="tg"></b>';const t=e.firstChild;ce(t,0);t.spellcheck=false;t.textContent=n.t;els.set(n.id,e);world.appendChild(e)}
const box=id=>{const n=nm(id),e=els.get(id);return{x:n.x,y:n.y,w:e.offsetWidth,h:e.offsetHeight}};
function path(a,b){const A=box(a),B=box(b),dx=B.x+B.w/2-A.x-A.w/2,dy=B.y+B.h/2-A.y-A.h/2;let p,q,c,d,m;if(Math.abs(dx)>Math.abs(dy)){const s=dx<0?-1:1;p=[A.x+(s>0?A.w:0),A.y+A.h/2];q=[B.x+(s>0?0:B.w),B.y+B.h/2];m=Math.abs(q[0]-p[0])/2;c=[p[0]+s*m,p[1]];d=[q[0]-s*m,q[1]]}else{const s=dy<0?-1:1;p=[A.x+A.w/2,A.y+(s>0?A.h:0)];q=[B.x+B.w/2,B.y+(s>0?0:B.h)];m=Math.abs(q[1]-p[1])/2;c=[p[0],p[1]+s*m];d=[q[0],q[1]-s*m]}return`M${p}C${c} ${d} ${q}`}
function rl(){let h=S.links.map((l,i)=>{if(hid(l.a)||hid(l.b))return'';const d=path(l.a,l.b),on=l.a==sel||l.b==sel||selL===i;return`<path class="lk${on?' on':''}" d="${d}"/><path class="hit" data-i="${i}" d="${d}"/>`}).join('');h+=S.notes.map(n=>n.p&&nm(n.p)&&!hid(n.id)?`<path class="pl" d="${path(n.p,n.id)}"/>`:'').join('');if(sug)h+=`<path class="sg" d="${path(sug.a,sug.b)}"/>`;LK.innerHTML=h}
const sm=p=>p.length<3?`M${p[0]}L${p[p.length-1]}`:`M${p[0]}`+p.slice(1,-1).map((q,i)=>`Q${q} ${[(q[0]+p[i+2][0])/2,(q[1]+p[i+2][1])/2]}`).join('')+`L${p[p.length-1]}`;
function rd(){DR.innerHTML=S.strokes.map(s=>`<path class="ds" d="${sm(s.p)}"/>`).join('')}
/* subespaços: visibilidade, contagem, ações e lista lateral */
function rv(){S.notes.forEach(n=>{const e=els.get(n.id),p=n.p&&nm(n.p);e.classList.toggle('hid',!!(p&&p.col));e.children[3].textContent=n.k=='sub'?(n.col?'▸ ':'▾ ')+kids(n.id).length:'';e.children[1].innerHTML=n.k=='sub'?'<u class="ad">+ anotação</u>':new Date(n.c).toLocaleString('pt-BR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+(p?'<u class="un">soltar</u>':'')});side()}
function toggle(id){const n=nm(id);n.col=!n.col;n.u=Date.now();rv();rl();save()}
function setP(id,p){const n=nm(id);n.p=p;n.u=Date.now();rv();rl();save()}
function addKid(pid){const p=nm(pid),b=box(pid),k=kids(pid).length,n={id:uid(),x:p.x+16,y:p.y+b.h+36+k*64,t:'',c:Date.now(),u:Date.now(),p:pid};if(p.col){p.col=false;p.u=Date.now()}S.notes.push(n);mk(n);rv();select(n.id);edit(n.id)}
function side(){if(!SD.classList.contains('open'))return;const ln=n=>esc((n.t.split('\n')[0]||'sem título').slice(0,40));let h='';S.notes.filter(n=>n.k=='sub').forEach(n=>{h+=`<div class="r s" data-id="${n.id}"><b data-tg="${n.id}">${n.col?'▸':'▾'}</b>${ln(n)}<small>${kids(n.id).length}</small></div>`;if(!n.col)kids(n.id).forEach(c=>h+=`<div class="r k" data-id="${c.id}">${ln(c)}</div>`)});const lo=S.notes.filter(n=>n.k!='sub'&&!(n.p&&nm(n.p)));if(lo.length)h+='<div class="h">Soltas</div>'+lo.map(c=>`<div class="r k" data-id="${c.id}">${ln(c)}</div>`).join('');$('#sl').innerHTML=h||'<p>Nenhum subespaço ainda.</p>'}
$('#sl').onclick=e=>{const t=e.target.closest('[data-tg]');if(t)return toggle(t.dataset.tg);const r=e.target.closest('.r');if(!r)return;const n=nm(r.dataset.id),el=els.get(n.id);select(n.id);if(n.k=='sub')fit(800,[n,...kids(n.id)]);else fly(n.x+el.offsetWidth/2,n.y+el.offsetHeight/2,Math.max(cam.k,.9));if(innerWidth<700)SD.classList.remove('open')};
$('#mb').onclick=()=>{SD.classList.toggle('open');side()};
function addSub(){add(...w2({clientX:innerWidth/2,clientY:innerHeight/2}),'sub')}
$('#ns').onclick=()=>{addSub();if(innerWidth<700)SD.classList.remove('open')};
function select(id){sel=id;selL=null;els.forEach((e,k)=>e.classList.toggle('sel',k==id));rl()}
function edit(id){const t=els.get(id).firstChild;ce(t,1);t.focus();const r=document.createRange();r.selectNodeContents(t);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function add(x,y,k){const n={id:uid(),x:x-8,y:y-20,t:'',c:Date.now(),u:Date.now()};if(k)n.k=k;S.notes.push(n);mk(n);rv();select(n.id);edit(n.id)}
function rm(id){tomb('n:'+id);S.links.filter(l=>l.a==id||l.b==id).forEach(l=>tomb('l:'+lk(l)));S.notes.forEach(c=>{if(c.p==id){c.p=null;c.u=Date.now()}});S.notes=S.notes.filter(n=>n.id!=id);S.links=S.links.filter(l=>l.a!=id&&l.b!=id);els.get(id)?.remove();els.delete(id);if(sel==id)sel=null;rv();checkSug();save()}
function link(a,b){if(S.links.some(l=>l.a==a&&l.b==b||l.a==b&&l.b==a))return;S.links.push({a,b,u:Date.now()});save();checkSug()}
function checkSug(){let b=0;sug=null;const T=S.notes.filter(n=>!hid(n.id)).map(n=>[n,tk(n.t)]);for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++){const[a,x]=T[i],[c,y]=T[j];if(ign.has(a.id+c.id)||S.links.some(l=>l.a==a.id&&l.b==c.id||l.a==c.id&&l.b==a.id))continue;let s=0;x.forEach(w=>y.has(w)&&s++);if(s>b){b=s;sug={a:a.id,b:c.id}}}const cut=t=>esc(t.length>30?t.slice(0,30).trim()+'…':t);if(sug)SG.firstChild.innerHTML=`Talvez <em>“${cut(nm(sug.a).t)}”</em> e <em>“${cut(nm(sug.b).t)}”</em> falem do mesmo assunto.`;SG.classList.toggle('on',!!sug);rl()}
$('#sy').onclick=()=>{S.links.push({a:sug.a,b:sug.b,s:1,u:Date.now()});save();checkSug()};
$('#sn').onclick=()=>{ign.add(sug.a+sug.b);save();checkSug()};
function setTool(t){tool=t;$('#bD').classList.toggle('on',!!t);st.style.cursor=t?'crosshair':'';dock.classList.toggle('show',!!t)}
st.oncontextmenu=e=>{if(!e.target.closest('.t:focus'))e.preventDefault()};
st.onpointerdown=e=>{const ed=e.target.closest('.t');if(ed&&document.activeElement==ed)return;document.activeElement?.blur?.();if(innerWidth<700)SD.classList.remove('open');
const ac=e.target.closest('.ad,.un,.tg');if(ac){e.preventDefault();const id=ac.closest('.note').dataset.id;ac.matches('.ad')?addKid(id):ac.matches('.un')?setP(id,null):toggle(id);return}
